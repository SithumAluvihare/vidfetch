name: Build and release

# Push a tag like v1.0.0 to build VidFetch for Windows and publish it as a GitHub Release.
# "Run workflow" on the Actions tab builds a test copy without releasing it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Set version from tag
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          (Get-Content app.py -Raw) -replace 'VERSION = "[^"]*"', "VERSION = `"$version`"" | Set-Content app.py -NoNewline
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          Select-String -Path app.py -Pattern '^VERSION ='

      - name: Build VidFetch.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name VidFetch
          --icon assets/icon.ico
          --add-data "ui;ui"
          --collect-data yt_dlp_ejs
          --exclude-module imageio_ffmpeg
          --exclude-module mutagen
          app.py

      - name: Bundle FFmpeg
        run: |
          function Get-FFmpeg($variant) {
            $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-$variant.zip"
            Invoke-WebRequest $url -OutFile "ffmpeg-$variant.zip"
            Expand-Archive "ffmpeg-$variant.zip" -DestinationPath "ff-$variant" -Force
            return (Get-ChildItem "ff-$variant" -Directory | Select-Object -First 1).FullName
          }
          # Prefer the LGPL build; fall back to GPL only if it lacks the MP3 encoder.
          $variant = "lgpl"
          $root = Get-FFmpeg $variant
          if (-not (& "$root\bin\ffmpeg.exe" -hide_banner -encoders | Select-String "libmp3lame")) {
            $variant = "gpl"
            $root = Get-FFmpeg $variant
          }
          Write-Host "Using FFmpeg $variant build"
          $dest = "dist/VidFetch/ffmpeg"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$root\bin\ffmpeg.exe", "$root\bin\ffprobe.exe" $dest
          Copy-Item "$root\LICENSE.txt" "$dest\LICENSE.txt"
          "FFmpeg $variant build from https://github.com/BtbN/FFmpeg-Builds (source: https://github.com/FFmpeg/FFmpeg)" | Out-File "$dest\SOURCE.txt"
          & "$dest\ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Bundle Deno (JavaScript runtime used by yt-dlp for YouTube)
        run: |
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          New-Item -ItemType Directory -Force dist/VidFetch/deno | Out-Null
          Expand-Archive deno.zip -DestinationPath dist/VidFetch/deno -Force
          Invoke-WebRequest "https://raw.githubusercontent.com/denoland/deno/main/LICENSE.md" -OutFile dist/VidFetch/deno/LICENSE.md
          dist/VidFetch/deno/deno.exe --version

      - name: Add licences and readme
        run: |
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.md dist/VidFetch/
          "VidFetch $env:VERSION`r`n`r`nDouble-click VidFetch.exe to start.`r`nWebsite: https://sithumaluvihare.github.io/vidfetch`r`nOnly download videos you own or have permission to save." | Out-File dist/VidFetch/README.txt

      - name: Smoke test
        run: |
          $env:VIDFETCH_HEADLESS = "1"
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          $p = Start-Process dist/VidFetch/VidFetch.exe -PassThru
          $html = $null
          for ($i = 0; $i -lt 60 -and -not $html; $i++) {
            Start-Sleep 1
            try { $html = (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).Content } catch {}
          }
          if (-not $html) { Get-Content "$env:APPDATA\VidFetch\vidfetch.log" -ErrorAction SilentlyContinue; throw "VidFetch did not start" }
          $token = [regex]::Match($html, 'const TOKEN = "([^"]+)"').Groups[1].Value
          $h = @{ "X-Token" = $token }
          $state = Invoke-RestMethod http://127.0.0.1:8765/api/state -Headers $h
          Write-Host "VidFetch $($state.version), yt-dlp $($state.ytdlp), ffmpeg=$($state.ffmpeg)"
          if (-not $state.ffmpeg) { throw "Bundled FFmpeg was not found" }
          Get-Content "$env:APPDATA\VidFetch\vidfetch.log"
          Invoke-RestMethod http://127.0.0.1:8765/api/quit -Method Post -Headers $h -Body "{}" -ContentType "application/json" | Out-Null
          Start-Sleep 2
          if (-not $p.HasExited) { Stop-Process $p -Force }

      - name: Package
        run: |
          Compress-Archive dist/VidFetch -DestinationPath VidFetch-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash VidFetch-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  VidFetch-windows-x64.zip" | Out-File VidFetch-windows-x64.zip.sha256 -Encoding ascii
          Write-Host "SHA-256: $hash"
          "SHA256=$hash" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: VidFetch-windows-x64
          path: |
            VidFetch-windows-x64.zip
            VidFetch-windows-x64.zip.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: VidFetch ${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ### Download
            **[VidFetch-windows-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/VidFetch-windows-x64.zip)** for Windows 10 and 11 (64-bit). Unzip it and double-click `VidFetch.exe`.

            If Windows shows "Windows protected your PC", click **More info → Run anyway**. The app isn't code-signed yet.

            SHA-256: `${{ env.SHA256 }}`
          files: |
            VidFetch-windows-x64.zip
            VidFetch-windows-x64.zip.sha256
