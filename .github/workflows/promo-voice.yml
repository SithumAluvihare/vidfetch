name: Promo voiceover (temporary)

on:
  push:
    branches: [promo-voice]

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile
      - run: python promo/tts.py af_heart,af_bella,am_michael,am_fenrir,am_puck,bm_george 1.1
      - name: Save takes to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo/out
          git commit -m "Voice takes [skip ci]"
          git push
